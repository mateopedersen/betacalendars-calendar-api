openapi: 3.1.0
info:
  title: BetaCalendars Printable Calendar Geometry API
  version: 1.0.0
  summary: Deterministic Gregorian grids and printable page geometry.
  description: >-
    Read-only API for month grids, yearly summaries, bounded date ranges,
    physical print layout, blank grids, calendar topology, comparisons, and
    canonical human-readable references. Results are deterministic and do not
    depend on local timezone, DST, locale, or current date.
  contact:
    name: Beta Calendars
    url: https://www.betacalendars.com/
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: https://api.betacalendars.com
    description: Production API hostname (requires deployment and DNS activation)
tags:
  - name: System
  - name: Calendar
  - name: Ranges
  - name: Layout
  - name: Blank grids
  - name: Topology
  - name: References
paths:
  /health:
    get:
      tags: [System]
      summary: Check API health
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, service: betacalendars-calendar-api }
  /v1/month/{year}/{month}:
    get:
      tags: [Calendar]
      summary: Build a Gregorian month grid
      operationId: getMonthGrid
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/WeekStart'
        - $ref: '#/components/parameters/GridMode'
        - name: adjacentDays
          in: query
          schema: { type: string, enum: [include, hide, placeholder], default: include }
          description: Show adjacent month dates or leave those structural cells empty.
      responses:
        '200':
          description: Computed month grid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Month' }
              example:
                year: 2027
                month: 1
                monthName: January
                daysInMonth: 31
                firstWeekday: friday
                lastWeekday: sunday
                weekStart: monday
                gridMode: fixed-six-weeks
                rowCount: 6
                leadingCellCount: 4
                trailingCellCount: 7
                weeks: [[{ date: '2026-12-28', day: 28, kind: adjacent, monthOffset: -1 }]]
                reference: { title: January Calendar, url: 'https://www.betacalendars.com/january-calendar.html' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/year/{year}:
    get:
      tags: [Calendar]
      summary: Summarize all months in a year
      operationId: getYearSummary
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/WeekStart'
        - $ref: '#/components/parameters/GridMode'
      responses:
        '200':
          description: Compact summaries for twelve months.
          content:
            application/json:
              schema:
                type: object
                required: [year, isLeapYear, months]
                properties:
                  year: { type: integer }
                  isLeapYear: { type: boolean }
                  months: { type: array, minItems: 12, maxItems: 12, items: { $ref: '#/components/schemas/MonthSummary' } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/range:
    get:
      tags: [Ranges]
      summary: Summarize a chronological month range
      operationId: getMonthRange
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, example: '2026-11' }
        - { name: to, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, example: '2027-02' }
        - $ref: '#/components/parameters/WeekStart'
        - $ref: '#/components/parameters/GridMode'
      responses:
        '200':
          description: Inclusive month range, capped at 120 months.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, count, months]
                properties:
                  from: { type: string }
                  to: { type: string }
                  count: { type: integer, maximum: 120 }
                  weekStart: { $ref: '#/components/schemas/Weekday' }
                  gridMode: { $ref: '#/components/schemas/GridMode' }
                  months: { type: array, items: { $ref: '#/components/schemas/MonthSummary' } }
              example:
                from: '2026-11'
                to: '2027-02'
                count: 4
                weekStart: monday
                gridMode: natural
                months: [{ year: 2026, month: 11, monthName: November, daysInMonth: 30 }]
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/print-layout/{year}/{month}:
    get:
      tags: [Layout]
      summary: Calculate page geometry in millimetres
      operationId: getPrintLayout
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Month'
        - { name: paper, in: query, schema: { type: string, enum: [a4, letter, a5, legal], default: a4 } }
        - { name: orientation, in: query, schema: { type: string, enum: [portrait, landscape], default: portrait } }
        - $ref: '#/components/parameters/WeekStart'
        - $ref: '#/components/parameters/GridMode'
        - { name: margin, in: query, schema: { type: number, minimum: 0, maximum: 100, default: 10 }, description: Uniform margin on each edge in mm. }
        - { name: headerHeight, in: query, schema: { type: number, minimum: 0, default: 20 } }
        - { name: weekdayHeaderHeight, in: query, schema: { type: number, minimum: 0, default: 10 } }
        - { name: notesHeight, in: query, schema: { type: number, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Computed paper, printable, header, grid, and cell dimensions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintLayout' }
              example:
                paper: { name: A4, widthMm: 210, heightMm: 297 }
                orientation: portrait
                printableArea: { xMm: 10, yMm: 10, widthMm: 190, heightMm: 277 }
                header: { heightMm: 20 }
                weekdayHeader: { heightMm: 10 }
                notes: { heightMm: 0 }
                grid: { xMm: 10, yMm: 40, widthMm: 190, heightMm: 247, rows: 6, columns: 7 }
                cell: { widthMm: 27.142857, heightMm: 41.166667, areaMm2: 1116.190476 }
                warnings: []
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/blank-grid:
    get:
      tags: [Blank grids]
      summary: Create an undated planning grid
      operationId: getBlankGrid
      parameters:
        - { name: rows, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 6 } }
        - { name: columns, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 7 } }
        - { name: paper, in: query, schema: { type: string, enum: [a4, letter, a5, legal], default: a4 } }
        - { name: orientation, in: query, schema: { type: string, enum: [portrait, landscape], default: portrait } }
        - { name: margin, in: query, schema: { type: number, minimum: 0, maximum: 100, default: 10 } }
      responses:
        '200':
          description: A date-free grid and printable cell geometry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlankGrid' }
              example:
                rows: 6
                columns: 7
                paper: { name: A4, widthMm: 210, heightMm: 297 }
                orientation: portrait
                printableArea: { xMm: 10, yMm: 10, widthMm: 190, heightMm: 277 }
                cell: { widthMm: 27.142857, heightMm: 46.166667, areaMm2: 1253.015873 }
                cells: [[{ row: 1, column: 1 }]]
                humanReadableReference: { title: Blank Calendar, url: 'https://www.betacalendars.com/blank-calendar' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/topology/{year}/{month}:
    get:
      tags: [Topology]
      summary: Inspect month structure independent of paper layout
      operationId: getMonthTopology
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Structural Gregorian metadata and topology signature.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topology' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/compare:
    get:
      tags: [Topology]
      summary: Compare two to twelve chronological months
      operationId: compareMonthTopologies
      parameters:
        - { name: months, in: query, required: true, schema: { type: string }, example: '2026-11,2026-12,2027-01,2027-02' }
        - $ref: '#/components/parameters/WeekStart'
        - $ref: '#/components/parameters/GridMode'
      responses:
        '200':
          description: Month summaries and adjacent structural differences.
          content:
            application/json:
              schema: { type: object, required: [months, differences], properties: { months: { type: array, items: { $ref: '#/components/schemas/MonthSummary' } }, differences: { type: array, items: { type: [object, 'null'] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/references/{slug}:
    get:
      tags: [References]
      summary: Resolve a canonical printable calendar reference
      operationId: getPrintableReference
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, enum: [january, february, march, april, may, june, july, august, september, october, november, december, blank-calendar] } }
      responses:
        '200':
          description: Title and canonical Beta Calendars URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reference' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    Year: { name: year, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 9999 } }
    Month: { name: month, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
    WeekStart: { name: weekStart, in: query, schema: { $ref: '#/components/schemas/Weekday', default: sunday } }
    GridMode: { name: gridMode, in: query, schema: { $ref: '#/components/schemas/GridMode', default: natural } }
  schemas:
    Weekday: { type: string, enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday] }
    GridMode: { type: string, enum: [natural, fixed-six-weeks] }
    Error: { type: object, required: [error], properties: { error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } } } }
    Health: { type: object, required: [status, service], properties: { status: { const: ok }, service: { const: betacalendars-calendar-api } } }
    Reference: { type: object, required: [title, url], properties: { title: { type: string }, url: { type: string, format: uri, pattern: '^https://www\\.betacalendars\\.com/' } } }
    CalendarDay: { type: object, required: [date, day, kind, monthOffset], properties: { date: { type: [string, 'null'], format: date }, day: { type: [integer, 'null'] }, kind: { type: string, enum: [current, adjacent, hidden, placeholder] }, monthOffset: { type: integer, enum: [-1, 0, 1] } } }
    Month: { type: object, required: [year, month, monthName, daysInMonth, firstWeekday, lastWeekday, weekStart, gridMode, rowCount, leadingCellCount, trailingCellCount, weeks, reference], properties: { year: { type: integer }, month: { type: integer }, monthName: { type: string }, daysInMonth: { type: integer }, firstWeekday: { $ref: '#/components/schemas/Weekday' }, lastWeekday: { $ref: '#/components/schemas/Weekday' }, weekStart: { $ref: '#/components/schemas/Weekday' }, gridMode: { $ref: '#/components/schemas/GridMode' }, rowCount: { type: integer, minimum: 4, maximum: 6 }, leadingCellCount: { type: integer }, trailingCellCount: { type: integer }, weeks: { type: array, items: { type: array, minItems: 7, maxItems: 7, items: { $ref: '#/components/schemas/CalendarDay' } } }, reference: { $ref: '#/components/schemas/Reference' } } }
    MonthSummary: { type: object, required: [year, month, monthName, daysInMonth, firstWeekday, lastWeekday, weekStart, gridMode, rowCount], properties: { year: { type: integer }, month: { type: integer }, monthName: { type: string }, daysInMonth: { type: integer }, firstWeekday: { $ref: '#/components/schemas/Weekday' }, lastWeekday: { $ref: '#/components/schemas/Weekday' }, weekStart: { $ref: '#/components/schemas/Weekday' }, gridMode: { $ref: '#/components/schemas/GridMode' }, rowCount: { type: integer }, leadingCellCount: { type: integer }, trailingCellCount: { type: integer }, reference: { $ref: '#/components/schemas/Reference' } } }
    Dimensions: { type: object, required: [widthMm, heightMm], properties: { widthMm: { type: number }, heightMm: { type: number } } }
    PrintLayout: { type: object, required: [paper, orientation, printableArea, header, weekdayHeader, grid, cell, warnings], properties: { paper: { allOf: [{ $ref: '#/components/schemas/Dimensions' }, { type: object, properties: { name: { type: string } } }] }, orientation: { type: string, enum: [portrait, landscape] }, printableArea: { type: object, properties: { xMm: { type: number }, yMm: { type: number }, widthMm: { type: number }, heightMm: { type: number } } }, header: { type: object, properties: { heightMm: { type: number } } }, weekdayHeader: { type: object, properties: { heightMm: { type: number } } }, notes: { type: object, properties: { heightMm: { type: number } } }, grid: { type: object, properties: { xMm: { type: number }, yMm: { type: number }, widthMm: { type: number }, heightMm: { type: number }, rows: { type: integer }, columns: { type: integer, const: 7 } } }, cell: { type: object, properties: { widthMm: { type: number }, heightMm: { type: number }, areaMm2: { type: number } } }, warnings: { type: array, items: { type: string } } } }
    BlankGrid: { type: object, required: [rows, columns, paper, orientation, printableArea, cell, cells, humanReadableReference], properties: { rows: { type: integer }, columns: { type: integer }, paper: { type: object }, orientation: { type: string }, printableArea: { type: object }, cell: { type: object }, cells: { type: array }, humanReadableReference: { $ref: '#/components/schemas/Reference' } } }
    Topology: { type: object, required: [year, month, daysInMonth, firstWeekday, lastWeekday, naturalRowCounts, fixedRowCount, leadingCellsByWeekStart, topologySignature], properties: { year: { type: integer }, month: { type: integer }, monthName: { type: string }, daysInMonth: { type: integer }, firstWeekday: { $ref: '#/components/schemas/Weekday' }, lastWeekday: { $ref: '#/components/schemas/Weekday' }, naturalRowCounts: { type: object }, fixedRowCount: { type: integer }, leadingCellsByWeekStart: { type: object }, topologySignature: { type: string } } }
  responses:
    BadRequest:
      description: Invalid path or query parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: invalid_request
              message: 'month must be an integer from 1 to 12'
    NotFound:
      description: No resource exists at this path.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
